services:
  db:
    image: mysql:8.0
    container_name: gce_mysql
    restart: always
    environment:
      MYSQL_DATABASE: my_laravel_db
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: user_password_123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: gce_laravel_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_KEY: "base64:SqOut+uRXP0OmPkGNpD+Jkct4USueu3bHL7ZTM6739M="
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: my_laravel_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: user_password_123
      SESSION_DRIVER: file
    depends_on:
      - db
    volumes:
      - .:/var/www/html

volumes:
   db_data:
