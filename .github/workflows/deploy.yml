name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 透過 Workload Identity 驗證登入 GCP (免 JSON 金鑰)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/839848886314/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-runner@project-0c604db6-ae89-41c9-b71.iam.gserviceaccount.com'

      # 2. 設定 Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. 自動部署 my-app-b1 服務
      - name: Deploy my-app-b1 to Cloud Run
        run: |
          gcloud run deploy my-app-b1 \
            --source . \
            --region asia-east1 \
            --allow-unauthenticated \
            --set-env-vars VIEW_VERSION=b1,SESSION_DRIVER=file,DB_CONNECTION=sqlite,APP_DEBUG=true,APP_KEY=base64:d3M0U2xVUXpIYTd2a0h0TU95aEF0eXB3MFRmS2JmU3I=

      # 4. 自動部署 my-app-b2 服務
      - name: Deploy my-app-b2 to Cloud Run
        run: |
          gcloud run deploy my-app-b2 \
            --source . \
            --region asia-east1 \
            --allow-unauthenticated \
            --set-env-vars VIEW_VERSION=b2,SESSION_DRIVER=file,DB_CONNECTION=sqlite,APP_DEBUG=true,APP_KEY=base64:d3M0U2xVUXpIYTd2a0h0TU95aEF0eXB3MFRmS2JmU3I=
